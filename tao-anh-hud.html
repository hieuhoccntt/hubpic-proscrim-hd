<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ghép ảnh HUD 106×160</title>
  <style>
    :root{color-scheme:dark;--bg:#07101b;--panel:#0d1928;--line:#24425b;--text:#edf8ff;--muted:#a2bdcc;--accent:#35dfb2;}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#123c4a 0,transparent 36%),var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}main{width:min(940px,calc(100% - 28px));margin:34px auto}.card{background:linear-gradient(135deg,rgba(13,30,43,.96),rgba(7,15,26,.98));border:1px solid var(--line);border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 14px 36px #0005}h1{margin:0 0 4px;font-size:clamp(25px,4vw,34px)}h2{font-size:18px;margin:0 0 9px}.hint{margin:0;color:var(--muted);font-size:13px}.upload-grid{display:grid;grid-template-columns:1fr 170px;gap:14px;margin-top:16px}.upload{display:block;min-height:132px;border:1px dashed #4b91a6;border-radius:14px;padding:17px;background:#071420;cursor:pointer}.upload strong,.upload small{display:block}.upload small{color:var(--muted);margin-top:5px}input[type=file]{display:none}.background-preview{display:none;min-height:132px;border:1px solid var(--line);border-radius:14px;padding:9px;background:#071420}.background-preview.show{display:grid;place-items:center}.background-preview img{display:block;max-width:150px;max-height:150px;object-fit:contain;border-radius:8px}.background-preview span{font-size:12px;color:var(--muted);margin-top:4px}select,input[type=range]{width:100%;margin-top:7px;accent-color:var(--accent)}.controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin-top:15px;padding:14px;border:1px solid var(--line);border-radius:14px;background:#071420}.control{font-weight:750;font-size:13px}.control output{float:right;color:#6df6d0}button{margin-top:16px;border:0;border-radius:10px;padding:11px 16px;background:linear-gradient(135deg,#19c896,#4fe4c4);color:#052017;font-weight:850;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.secondary{margin-left:8px;background:#1a3042;color:#dff8ff;border:1px solid #3f7691}.status{min-height:22px;color:#75f6ce;margin-top:10px;font-size:13px}.preview-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:16px}.preview{display:grid;grid-template-columns:160px minmax(0,1fr);gap:11px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:13px;background:#081321}.preview canvas{max-width:160px;max-height:160px;image-rendering:auto;border-radius:4px;background:conic-gradient(#16283b 25%,#0c1826 0 50%,#16283b 0 75%,#0c1826 0) 0/14px 14px}.preview strong{overflow-wrap:anywhere;font-size:13px}.preview small{display:block;color:var(--muted);font-size:12px;margin-top:5px}@media(max-width:620px){main{width:min(100% - 20px,940px);margin:20px auto}.card{padding:15px}.upload-grid{grid-template-columns:1fr}.controls{grid-template-columns:1fr}.preview-list{grid-template-columns:1fr}.preview{grid-template-columns:160px minmax(0,1fr)}}
  </style>
</head>
<body>
<main>
  <header><h1>Ghép ảnh HUD người chơi</h1><p class="hint">Tạo ảnh 106 × 160 hoặc 160 × 160 từ ảnh người chơi đã tách nền. Ảnh nền là tùy chọn; không chọn nền sẽ xuất PNG trong suốt.</p></header>
  <section class="card">
    <h2>1. Chọn ảnh nền</h2>
    <div class="upload-grid"><label class="upload" for="backgroundInput"><strong>🖼️ Tải ảnh nền (tùy chọn)</strong><small id="backgroundName">Không chọn nền vẫn tải ZIP được — ảnh sẽ có nền trong suốt. Khung 106 × 160 có thể chỉnh nền; khung 160 × 160 giữ nguyên nền gốc.</small><input id="backgroundInput" type="file" accept="image/*"></label><aside class="background-preview" id="backgroundPreview"><img id="backgroundPreviewImage" alt="Xem trước ảnh nền"><span>Preview nền</span></aside></div>
    <div class="controls">
      <label class="control">Kích thước khung<select id="canvasSize"><option value="106x160">106 × 160</option><option value="160x160">160 × 160</option></select></label>
      <label class="control" id="bgWidthControl">Rộng nền <output id="bgWidthValue">100%</output><input id="bgWidth" type="range" min="70" max="180" value="100"></label>
      <label class="control" id="bgHeightControl">Dài nền <output id="bgHeightValue">100%</output><input id="bgHeight" type="range" min="70" max="180" value="100"></label>
    </div>
    <button id="clearBackground" class="secondary" disabled>✕ Xóa ảnh nền</button>
  </section>
  <section class="card">
    <h2>2. Chọn ảnh người chơi đã tách nền</h2>
    <label class="upload" for="playersInput"><strong>👤 Tải một hoặc nhiều ảnh người chơi</strong><small id="playersName">Nên dùng PNG nền trong suốt. Tên file ảnh sẽ được giữ nguyên khi tải xuống.</small><input id="playersInput" type="file" accept="image/*" multiple></label>
    <button id="downloadAll" disabled>⬇ Tải ZIP (RolePictureHUD + RolePicture)</button>
    <div class="status" id="status" role="status"></div>
    <div class="preview-list" id="previewList"></div>
  </section>
</main>
<script>
  const $=id=>document.getElementById(id);
  let background=null, players=[];
  const loadImage=file=>new Promise((resolve,reject)=>{const image=new Image();const url=URL.createObjectURL(file);image.onload=()=>{URL.revokeObjectURL(url);resolve(image)};image.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Không đọc được ảnh'))};image.src=url});
  function dimensions(){return $('canvasSize').value.split('x').map(Number)}
  function isSquareMode(){return $('canvasSize').value==='160x160'}
  function syncBackgroundControls(){const editable=!isSquareMode();$('bgWidth').disabled=!editable;$('bgHeight').disabled=!editable;$('bgWidthControl').style.opacity=editable?'1':'.42';$('bgHeightControl').style.opacity=editable?'1':'.42';$('bgWidthControl').title=editable?'':'Khung 160 × 160 luôn dùng nền gốc, không chỉnh kích thước.';$('bgHeightControl').title=$('bgWidthControl').title}
  function drawCover(ctx,img,width,height){if(isSquareMode()){ctx.drawImage(img,0,0);return}const scale=Math.max(width/img.width,height/img.height),w=img.width*scale*Number($('bgWidth').value)/100,h=img.height*scale*Number($('bgHeight').value)/100;ctx.drawImage(img,(width-w)/2,(height-h)/2,w,h)}
  function alphaBounds(image){const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});canvas.width=image.width;canvas.height=image.height;ctx.drawImage(image,0,0);const pixels=ctx.getImageData(0,0,canvas.width,canvas.height).data;let left=canvas.width,top=canvas.height,right=-1,bottom=-1;for(let y=0;y<canvas.height;y++)for(let x=0;x<canvas.width;x++)if(pixels[(y*canvas.width+x)*4+3]>16){left=Math.min(left,x);right=Math.max(right,x);top=Math.min(top,y);bottom=Math.max(bottom,y)}return right<left?{x:0,y:0,w:image.width,h:image.height}:{x:left,y:top,w:right-left+1,h:bottom-top+1}}
  function playerCrop(image){const box=alphaBounds(image),portraitRatio=106/160;let sw=Math.min(image.width,box.w*1.1),sh=sw/portraitRatio,sx=Math.max(0,Math.min(image.width-sw,box.x+box.w/2-sw/2)),sy=box.y;if(sh>box.h){sh=box.h;sw=sh*portraitRatio;sx=Math.max(0,Math.min(image.width-sw,box.x+box.w/2-sw/2))}return{sx,sy,sw,sh}}
  function drawPlayer(ctx,image,width,height){const {sx,sy,sw,sh}=playerCrop(image);if(width===160&&height===160){const portraitWidth=106;ctx.drawImage(image,sx,sy,sw,sh,(width-portraitWidth)/2,0,portraitWidth,height);return}ctx.drawImage(image,sx,sy,sw,sh,0,0,width,height)}
  function sharpen(ctx,width,height){const image=ctx.getImageData(0,0,width,height),source=image.data.slice(),amount=.18;for(let y=1;y<height-1;y++)for(let x=1;x<width-1;x++){const index=(y*width+x)*4;if(!source[index+3])continue;for(let channel=0;channel<3;channel++){const center=source[index+channel],left=source[index-4+channel],right=source[index+4+channel],up=source[index-width*4+channel],down=source[index+width*4+channel];image.data[index+channel]=Math.max(0,Math.min(255,center*(1+4*amount)-amount*(left+right+up+down)))}}ctx.putImageData(image,0,0)}
  function outputType(file){return ['image/png','image/jpeg','image/webp'].includes(file.type)?file.type:'image/png'}
  function createCanvas(player){const [width,height]=dimensions(),canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;const ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';if(background)drawCover(ctx,background,width,height);drawPlayer(ctx,player.image,width,height);if(width===106)sharpen(ctx,width,height);return canvas}
  function redraw(){syncBackgroundControls();const list=$('previewList');list.replaceChildren();if(!players.length){$('downloadAll').disabled=true;return}$('downloadAll').disabled=false;const [width,height]=dimensions();players.forEach(player=>{const canvas=createCanvas(player);player.canvas=canvas;const item=document.createElement('article');item.className='preview';const info=document.createElement('div');const name=document.createElement('strong');name.textContent=player.file.name;const note=document.createElement('small');note.textContent=`Xuất ${width} × ${height} • ${background?(isSquareMode()?'giữ nguyên nền gốc':'có thể chỉnh nền'):'nền trong suốt'} • giữ nguyên tên file`;info.append(name,note);item.append(canvas,info);list.append(item)});$('status').textContent=`Đã ghép sẵn ${players.length} ảnh${background?' có nền':' nền trong suốt'}. Nhấn nút tải ZIP để nhận hai thư mục RolePictureHUD và RolePicture.`}
  $('backgroundInput').addEventListener('change',async event=>{const file=event.target.files[0];if(!file)return;try{background=await loadImage(file);const previewURL=URL.createObjectURL(file);$('backgroundPreviewImage').src=previewURL;$('backgroundPreviewImage').onload=()=>URL.revokeObjectURL(previewURL);$('backgroundPreview').classList.add('show');$('backgroundName').textContent=`Đã chọn nền: ${file.name}`;$('clearBackground').disabled=false;redraw()}catch{$('status').textContent='Không thể đọc ảnh nền này.'}});
  $('clearBackground').addEventListener('click',()=>{background=null;$('backgroundInput').value='';$('backgroundPreviewImage').removeAttribute('src');$('backgroundPreview').classList.remove('show');$('backgroundName').textContent='Không chọn nền vẫn tải ZIP được — ảnh sẽ có nền trong suốt.';$('clearBackground').disabled=true;$('status').textContent='Đã xóa ảnh nền; ảnh xuất sẽ trong suốt.';redraw()});
  [['canvasSize'],['bgWidth','bgWidthValue'],['bgHeight','bgHeightValue']].forEach(([id,output])=>$(id).addEventListener('input',()=>{if(output)$(output).textContent=$(id).value+'%';redraw()}));
  $('playersInput').addEventListener('change',async event=>{const files=[...event.target.files];if(!files.length)return;try{players=await Promise.all(files.map(async file=>({file,image:await loadImage(file),canvas:null})));$('playersName').textContent=`Đã chọn ${players.length} ảnh người chơi. Tên file sẽ giữ nguyên.`;redraw()}catch{$('status').textContent='Có ảnh người chơi không thể đọc được.'}});
  const encoder=new TextEncoder();
  const crc32=bytes=>{let crc=0xffffffff;for(const byte of bytes){crc^=byte;for(let bit=0;bit<8;bit++)crc=(crc>>>1)^((crc&1)?0xedb88320:0)}return(crc^0xffffffff)>>>0};
  const u16=value=>[value&255,(value>>>8)&255],u32=value=>[value&255,(value>>>8)&255,(value>>>16)&255,(value>>>24)&255];
  const joinBytes=parts=>{const size=parts.reduce((total,part)=>total+part.length,0),joined=new Uint8Array(size);let at=0;for(const part of parts){joined.set(part,at);at+=part.length}return joined};
  function zipStore(files){let offset=0;const localParts=[],centralParts=[];for(const file of files){const name=encoder.encode(file.name),data=new Uint8Array(file.data),crc=crc32(data),localHeader=new Uint8Array([80,75,3,4,20,0,0,0,0,0,0,0,0,0,...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),0,0]),local=joinBytes([localHeader,name,data]),centralHeader=new Uint8Array([
    80,75,1,2,20,0,20,0,
    0,0, /* cờ */ 0,0, /* nén */ 0,0, /* giờ */ 0,0, /* ngày */
    ...u32(crc),...u32(data.length),...u32(data.length),
    ...u16(name.length),0,0, /* extra */ 0,0, /* comment */ 0,0, /* đĩa */ 0,0, /* thuộc tính trong */
    ...u32(file.folder?16:0),...u32(offset)
  ]);localParts.push(local);centralParts.push(joinBytes([centralHeader,name]));offset+=local.length}const central=joinBytes(centralParts),end=new Uint8Array([80,75,5,6,0,0,0,0,...u16(files.length),...u16(files.length),...u32(central.length),...u32(offset),0,0]);return new Blob([...localParts,central,end],{type:'application/zip'})}
  $('downloadAll').addEventListener('click',async()=>{if(!players.length)return;const button=$('downloadAll');button.disabled=true;$('status').textContent='Đang tạo file ZIP chất lượng cao…';try{const files=[{name:'RolePictureHUD/',data:new ArrayBuffer(0),folder:true},{name:'RolePicture/',data:new ArrayBuffer(0),folder:true}];for(const player of players){const blob=await new Promise(resolve=>player.canvas.toBlob(resolve,'image/png'));const data=await blob.arrayBuffer(),name=player.file.name.replace(/\.[^.]+$/,'')+'.png';files.push({name:`RolePictureHUD/${name}`,data},{name:`RolePicture/${name}`,data})}const url=URL.createObjectURL(zipStore(files)),link=document.createElement('a');link.href=url;link.download='RolePictureHUD-RolePicture.zip';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);$('status').textContent=`Đã tải ZIP chất lượng cao: 2 thư mục RolePictureHUD và RolePicture, mỗi thư mục có ${players.length} ảnh PNG giống nhau.`}catch{$('status').textContent='Không thể tạo file ZIP. Hãy thử lại.'}button.disabled=false});
</script>
</body>
</html>
